name: Pipeline Health

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: pipeline-health
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    defaults:
      run:
        working-directory: take-homes/applied-ai-engineer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test
        run: python -m unittest discover -s solution/tests -q
      - name: Review Without Filing
        id: review
        if: always()
        run: python -m solution review
      - name: Check Health
        id: health
        if: always()
        run: python -m solution monitor --expected-calls 140 --max-age-seconds 3600 > solution/state/scheduled-health.json
      - name: Retain Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-health-${{ github.run_id }}
          path: take-homes/applied-ai-engineer/solution/state/
          retention-days: 14
      - name: Route Operator Alert
        if: always()
        uses: actions/github-script@v7
        env:
          HEALTH_OUTCOME: ${{ steps.health.outcome }}
          REVIEW_OUTCOME: ${{ steps.review.outcome }}
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const title = '[Pipeline monitor] Operator attention required';
            const marker = '<!-- june-tapes-health-monitor -->';
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, state: 'open', creator: 'github-actions[bot]', per_page: 100
            });
            const existing = issues.find(issue => issue.title === title && issue.body?.includes(marker));
            const healthy = process.env.HEALTH_OUTCOME === 'success'
              && process.env.REVIEW_OUTCOME === 'success' && process.env.JOB_STATUS === 'success';
            if (healthy) {
              if (existing) await github.rest.issues.update({
                ...context.repo, issue_number: existing.number, state: 'closed'
              });
              return;
            }
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `${marker}\nHealth check needs attention. Inspect [run and artifacts](${run}).\n\nNo tickets were filed; this workflow never invokes apply.\n\nReview: ${process.env.REVIEW_OUTCOME}; health: ${process.env.HEALTH_OUTCOME}; job: ${process.env.JOB_STATUS}.`;
            if (existing) await github.rest.issues.update({
              ...context.repo, issue_number: existing.number, body
            });
            else await github.rest.issues.create({...context.repo, title, body});